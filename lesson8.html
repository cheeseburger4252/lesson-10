<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="style.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="script.js" defer></script>
</head>
<body>
    <form class="filters">
        <p>Min price: </p>
        <input type="text" id="minprice" value="0.00">
        <p>Max price: </p>
        <input type="text" id="maxprice" value="1.00">
        <p>EDUCATION: </p>
        <input type="radio" name="type" id="education" value="education">
        <p>RECREATIONAL: </p>
        <input type="radio" name="type" id="recreational" value="recreational">
        <p>SOCIAL: </p>
        <input type="radio" name="type" id="social" value="social">
        <p>DIY: </p>
        <input type="radio" name="type" id="diy" value="diy">
        <p>CHARITY: </p>
        <input type="radio" name="type" id="charity" value="charity">
        <p>COOKING: </p>
        <input type="radio" name="type" id="cooking" value="cooking">
        <p>RELAXATION: </p>
        <input type="radio" name="type" id="relaxation" value="relaxation">
        <p>MUSIC: </p>
        <input type="radio" name="type" id="music" value="music">
        <p>BUSYWORK: </p>
        <input type="radio" name="type" id="busywork" value="busywork">
    </form>
    <button class="skinuti">Skinuti</button>
    <div class="container">
        <button id="tog">Randomize activity</button>
        <div class="activity"></div>
    </div>
    
</body>
</html>
